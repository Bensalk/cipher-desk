name: Screenshots
# Run by hand (Actions > Screenshots > Run workflow). Builds the Linux app, starts the
# local RDP test host (random password per run) and takes the README screenshots at
# phone, tablet and desktop sizes with app/integration_test/screenshots/. The PNGs are
# pushed to the 'screenshots' branch and uploaded as an artifact, to copy into
# docs/screenshots/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/integration_test/screenshots/**
      - .github/workflows/screenshots.yml

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the 'screenshots' branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build dependencies and the test host
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            xvfb xterm freerdp3-shadow-x11 winpr3-utils openssl fonts-noto-core
      - name: Start the test host (random password per run)
        run: bash scripts/start-test-hosts.sh
      - name: Take screenshots
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get
          xvfb-run -a -s "-screen 0 1920x1440x24" flutter test \
            integration_test/screenshots/screenshots_test.dart -d linux \
            --dart-define=SHOT_DIR="$PWD/../shots" 2>&1 | tee ../shots.log || {
            # Job logs can be hard to reach; show the end of the output as an annotation.
            # (The test host's password is masked by start-test-hosts.sh and never printed.)
            tail -n 80 ../shots.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > ../tail.txt
            echo "::error title=Screenshot test failed::$(cat ../tail.txt)"
            exit 1
          }
      - name: Save screenshots to the 'screenshots' branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || { echo "No screenshots taken"; exit 1; }
          cd shots
          git init -q && git checkout -q -b screenshots
          git add ./*.png
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "App screenshots [skip ci]"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cipher-desk-screenshots
          path: shots/
