name: One-off - regenerate FRB bridge code

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.97.0"
  FRB_VERSION: "2.13.0"

jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked
      - name: Regenerate bridge code
        run: flutter_rust_bridge_codegen generate --no-add-mod-to-lib
      - name: Format generated Dart
        run: dart format lib/src/rust
      - name: Show what changed
        working-directory: .
        run: git diff --stat -- rust/bridge/src/frb_generated.rs app/lib/src/rust
      - name: Commit regenerated bridge code, if anything changed
        working-directory: .
        run: |
          git config user.name "Bensal"
          git config user.email "Bensalk@users.noreply.github.com"
          git add -- rust/bridge/src/frb_generated.rs app/lib/src/rust
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bridge): regenerate flutter_rust_bridge bindings (frb ${{ env.FRB_VERSION }})"
            git push origin HEAD:${{ github.ref_name }}
          fi
