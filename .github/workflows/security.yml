name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks && sudo install gitleaks /usr/local/bin/
      - name: Scan every commit
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --verbose

  dependencies:
    name: Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Fuzz our parsers (SA-3, 60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Run the fuzzers
        run: bash rust/fuzz/run.sh 60
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes
          path: rust/fuzz/artifacts/
          retention-days: 14

  osv:
    name: Known vulnerabilities (OSV-Scanner, all ecosystems)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Run OSV-Scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          # No --config: each folder's own osv-scanner.toml applies (the app's at the
          # root; the test-only host and fuzzers have their own reviewed exceptions).
          set +e
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive --format json --output osv.json .
          status=$?
          set -e
          # Show each finding as an annotation (visible on the run page without the full log).
          if [ -s osv.json ]; then
            jq -r '.results[]? as $r | $r.packages[]? as $p | $p.vulnerabilities[]? |
              "::error title=\(.id)::\($p.package.ecosystem) \($p.package.name) \($p.package.version) in \($r.source.path | sub("^/home/runner/work/[^/]+/[^/]+/"; ""))"' osv.json
          fi
          exit "$status"

  codeql:
    name: CodeQL (${{ matrix.language }})
    # GitHub code scanning is only free for public repositories. While this
    # repository is private, CodeQL is skipped; it starts once it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
