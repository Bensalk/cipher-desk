name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.0"
  FRB_VERSION: "2.13.0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (debug)
        run: cargo test --workspace
      - name: Tests (release — checks release logging cap)
        run: cargo test --workspace --release
      - name: Security policy checks
        shell: bash
        run: sh scripts/check-policy.sh
      - name: Windows Credential Manager round trip
        if: runner.os == 'Windows'
        env:
          RDPV_TEST_VAULT: available
        run: cargo test -p rdpv-core --test live_vault real_vault -- --ignored

  live-host:
    name: Live RDP host tests (NLA, pinning, errors, input, logs)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install test hosts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb xterm freerdp3-shadow-x11 winpr3-utils xrdp xorgxrdp openssl \
            gnome-keyring dbus-x11 x11vnc
      - name: Start test hosts (random password per run)
        run: bash scripts/start-test-hosts.sh
      - name: Live tests with an OS keyring (debug and release)
        env:
          RDPV_TEST_VAULT: available
        run: |
          dbus-run-session -- bash -c '
            set -e
            openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            bash scripts/ci-run.sh "live_host (debug)" cargo test -p rdpv-core --test live_host -- --ignored --test-threads=1
            bash scripts/ci-run.sh "live_vault" cargo test -p rdpv-core --test live_vault real_vault -- --ignored
            bash scripts/ci-run.sh "live_clipboard" cargo test -p rdpv-core --test live_clipboard -- --ignored --test-threads=1
            bash scripts/ci-run.sh "live_host (release)" cargo test --release -p rdpv-core --test live_host -- --ignored --test-threads=1
            bash scripts/ci-run.sh "live_vnc" cargo test -p rdpv-core --test live_vnc -- --ignored --test-threads=1
          '
      - name: Reliability tests (reconnect, certificate on reconnect, memory; Stage 8)
        # L3 (silent network drop) needs root to change firewall rules; it is run
        # locally.
        run: bash scripts/ci-run.sh "Reliability tests" cargo test -p rust_lib_cipher_desk --lib live_ -- --ignored --test-threads=1 --skip live_l3
      - name: Vault refuses to save when no keyring exists (I8)
        env:
          RDPV_TEST_VAULT: missing
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent/bus
        run: cargo test -p rdpv-core --test live_vault missing_vault -- --ignored

  flutter:
    name: Flutter app (${{ matrix.target }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
          - target: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Free disk space (the Android debug build needs it)
        if: matrix.target == 'android'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked
      - name: Regenerate bridge code
        run: flutter_rust_bridge_codegen generate --no-add-mod-to-lib
      - name: Generated bridge code is up to date
        shell: bash
        run: |
          dart format lib/src/rust
          git diff --exit-code -- ../rust/bridge/src/frb_generated.rs || {
            echo "::error::rust/bridge/src/frb_generated.rs is out of date — run flutter_rust_bridge_codegen generate";
            exit 1; }
      - run: flutter pub get
      - name: Analyze
        run: bash ../scripts/ci-run.sh "flutter analyze" flutter analyze --no-fatal-infos
      - name: Unit tests
        run: bash ../scripts/ci-run.sh "Flutter unit tests" flutter test
      - name: Build Linux
        if: matrix.target == 'linux'
        run: bash ../scripts/ci-run.sh "Linux build" flutter build linux --debug
      - name: Integration test (Linux, Rust ↔ Flutter)
        if: matrix.target == 'linux'
        run: bash ../scripts/ci-run.sh "Linux integration test" xvfb-run -a -s "-screen 0 1920x1080x24" flutter test integration_test/hello_test.dart -d linux
      - name: Start-up output of the Linux app (only when a step failed)
        if: failure() && matrix.target == 'linux'
        run: |
          timeout 20 xvfb-run -a -s "-screen 0 1920x1080x24" build/linux/x64/debug/bundle/cipher_desk \
            > startup.log 2>&1; echo "exit code: $?" >> startup.log
          msg=$(tail -n 60 startup.log | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Linux app start-up output::$msg"
      - name: Build Windows
        if: matrix.target == 'windows'
        shell: bash
        run: bash ../scripts/ci-run.sh "Windows build" flutter build windows --debug
      - name: Integration test (Windows, Rust ↔ Flutter)
        if: matrix.target == 'windows'
        shell: bash
        run: bash ../scripts/ci-run.sh "Windows integration test" flutter test integration_test/hello_test.dart -d windows
      - name: Build Android APK
        if: matrix.target == 'android'
        run: bash ../scripts/ci-run.sh "Android build" flutter build apk --debug --target-platform android-arm64
      - name: Android manifest security settings
        if: matrix.target == 'android'
        shell: bash
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' $m
          grep -q 'android:usesCleartextTraffic="false"' $m
          grep -q 'minSdk = 29' android/app/build.gradle.kts
          grep -q 'FLAG_SECURE' android/app/src/main/kotlin/io/github/bensalk/cipherdesk/MainActivity.kt
      - name: Upload debug builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-${{ matrix.target }}
          path: |
            app/build/linux/x64/debug/bundle
            app/build/windows/x64/runner/Debug
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/pubspec.lock
          if-no-files-found: ignore
          retention-days: 7

  android-emulator:
    name: Android app on an emulator (UI tests and a live session)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Start the test host (random password per run)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xterm freerdp3-shadow-x11 winpr3-utils openssl
          bash scripts/start-test-hosts.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get packages; test-host details in a private file (no password on a command line)
        working-directory: app
        run: |
          flutter pub get
          umask 077
          jq -n --arg u "$RDPV_TEST_USER" --arg p "$RDPV_TEST_PASSWORD" \
            '{RDPV_HOST: "10.0.2.2", RDPV_PORT: "3389", RDPV_USER: $u, RDPV_PASSWORD: $p, RDPV_REQUIRE_LIVE: "true"}' > "$RUNNER_TEMP/live.json"
      - name: Tests on the emulator (Android 10, the oldest supported)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: app
          script: |
            bash ../scripts/ci-run.sh "Android UI tests" timeout 1500 flutter test integration_test/hello_test.dart -d emulator-5554 --timeout 5m --reporter expanded
            bash ../scripts/ci-run.sh "Android live session" timeout 1200 flutter test integration_test/live_session_test.dart -d emulator-5554 --timeout 6m --reporter expanded --dart-define-from-file="$RUNNER_TEMP/live.json"
