[package]
name = "rdpv-core"
description = "Shared core of Cipher Desk: connection engine, security policy, profiles, vault access."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ironrdp-connector.workspace = true
ironrdp-session.workspace = true
ironrdp-graphics.workspace = true
ironrdp-pdu.workspace = true
ironrdp-core.workspace = true
ironrdp-blocking.workspace = true
ironrdp-input.workspace = true
ironrdp-cliprdr.workspace = true
ironrdp-svc.workspace = true
sspi.workspace = true
rustls.workspace = true
x509-cert.workspace = true
sha2.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
thiserror.workspace = true
# TCP keepalive settings (detects silently dropped networks, F13). "all" enables
# the probe count setting.
socket2 = { version = "0.6", features = ["all"] }

keyring-core = "1"

# OS password vaults (S4). Android uses the Android Keystore from Kotlin instead.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"] }

[features]
# Exposes internal parsers to the fuzzing crate only (rust/fuzz). Never used by the app.
fuzzing = []

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
