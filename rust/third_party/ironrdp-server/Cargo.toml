# Copy of ironrdp-server 0.13.0 (Devolutions IronRDP, MIT OR Apache-2.0), moved to the
# IronRDP 0.12 crate family used by the rest of Cipher Desk. Changes: see README-CIPHER-DESK.md.
[package]
name = "ironrdp-server"
version = "0.13.0-cipherdesk.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "Extendable skeleton for implementing custom RDP servers (Cipher Desk copy)"

[lib]
name = "ironrdp_server"
path = "src/lib.rs"
test = false
doctest = false

[features]
default = []
egfx = []
helper = []
nscodec = []
qoi = []
qoiz = []
rayon = []
__bench = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
ironrdp-acceptor = "0.12"
ironrdp-ainput = "0.10"
ironrdp-async = "0.12"
ironrdp-cliprdr = "0.9"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-echo = "0.6"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-rdpsnd = "0.11"
ironrdp-svc = "0.10"
ironrdp-connector = "0.12"
ironrdp-tokio = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["net", "macros", "sync", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"

[lints.rust]
unexpected_cfgs = "allow"
