[package]
name = "cipher-desk-host-service"
description = "Windows background service so Share screen can reach the sign-in screen (Cipher Desk Host)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cipher-desk-host-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tracing.workspace = true

# Windows only: the service, the session launch, and the sign-in-screen host.
[target.'cfg(windows)'.dependencies]
rdpv-core = { path = "../core" }
rdpv-host = { path = "../host" }
windows-service = "0.8"
tracing-subscriber.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }

# Its own lints: unsafe is needed for the Win32 session/token calls.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
