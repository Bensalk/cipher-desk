[package]
name = "rust_lib_cipher_desk"
description = "flutter_rust_bridge API layer between the Flutter UI and rdpv-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "rust_lib_cipher_desk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rdpv-core = { path = "../core" }
flutter_rust_bridge = "=2.13.0"
tracing.workspace = true

# Share screen (Cipher Desk Host) is Windows-only.
[target.'cfg(windows)'.dependencies]
rdpv-host = { path = "../host" }

# Same rules as the workspace, except `unsafe_code` is "deny" instead of "forbid"
# so the generated FFI module alone can opt out (see src/lib.rs).
[dev-dependencies]
tempfile = "3"
# Captures log output in the live tests (password-in-logs checks, SA-7).
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
