# OSV-Scanner exceptions for the TEST-ONLY fuzzing crate in this folder.
# It is never shipped; it links the app's core library, so the app's reviewed
# exceptions apply here too.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin timing attack (private-key operations). Same review as the app: no RSA private-key operations (see deny.toml and docs/SECURITY_REVIEW.md)."


[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-01-31
reason = "atomic-polyfill is unmaintained (no vulnerability). Pulled in by sspi -> winscard (smart-card emulation, never used by this app); sspi 0.23.1 is the latest release. Re-review 2027-01-31."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-01-31
reason = "zvariant is unmaintained because it was merged into zbus 6 (no vulnerability). Pulled in by the Linux keyring store (zbus-secret-service-keyring-store 1.0.1, latest), which still uses zbus 5. Re-review 2027-01-31."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-01-31
reason = "zbus_names is unmaintained (merged into zbus 6); same path and review as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-01-31
reason = "zvariant_derive is unmaintained (merged into zbus 6); same path and review as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
ignoreUntil = 2027-06-01
reason = "pin-utils is unmaintained (upstream archived 2026-10-01, no vulnerability). Same path as the app (async-dnssd 0.5.1). Re-review 2027-06-01 or when async-dnssd drops pin-utils."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
ignoreUntil = 2027-01-31
reason = "heapless 0.7.17 heap-inspection / incomplete zeroization. Pulled in by sspi -> winscard -> iso7816 (smart-card emulation, never used by this app; no code in rust/core, rust/host, rust/bridge or rust/host-service calls winscard/smart_card/iso7816). iso7816 0.1.4 pins heapless ^0.7; the fix is heapless 0.9.2+, a breaking bump iso7816 has not taken. Re-review 2027-01-31."

