name: secure_rdp_viewer
description: "Secure open-source RDP remote desktop viewer for Windows, Linux and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  rust_lib_secure_rdp_viewer:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.5
  # Windows Hello confirmation before a saved password is used (S5).
  local_auth: ^2.3.0
  # Choosing where to export and which file to import (Windows and Linux; F7).
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
