# Test-only RDP host used by the live clipboard tests. Not part of the app and
# never shipped. Kept outside the main workspace so its (older) IronRDP server
# dependencies never mix with the app's.
[package]
name = "rdp-test-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
ironrdp = { version = "0.17", features = ["server", "cliprdr", "connector"] }
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"
anyhow = "1"
async-trait = "0.1"
pico-args = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
