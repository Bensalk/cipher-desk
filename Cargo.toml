[workspace]
resolver = "2"
members = ["rust/core", "rust/bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
ironrdp = { version = "0.17", default-features = false }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
# flutter_rust_bridge generated code uses cfg(frb_expand)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
