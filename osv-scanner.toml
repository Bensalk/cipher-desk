# OSV-Scanner exceptions, each reviewed and explained (see docs/SECURITY_REVIEW.md).
# OSV also reports GitHub advisories and "unmaintained" notices that cargo-deny
# does not fail on; entries with ignoreUntil must be reviewed again by that date.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin timing attack affects private-key operations; this client performs RSA public-key operations only (via IronRDP sspi/picky). See docs/SECURITY_REVIEW.md."


[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-01-31
reason = "atomic-polyfill is unmaintained (no vulnerability). Pulled in by sspi -> winscard (smart-card emulation, never used by this app); sspi 0.23.1 is the latest release. Re-review 2027-01-31."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-01-31
reason = "zvariant is unmaintained because it was merged into zbus 6 (no vulnerability). Pulled in by the Linux keyring store (zbus-secret-service-keyring-store 1.0.1, latest), which still uses zbus 5. Re-review 2027-01-31."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-01-31
reason = "zbus_names is unmaintained (merged into zbus 6); same path and review as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-01-31
reason = "zvariant_derive is unmaintained (merged into zbus 6); same path and review as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
ignoreUntil = 2027-06-01
reason = "pin-utils is unmaintained (upstream archived 2026-10-01, no vulnerability). Pulled in by async-dnssd 0.5.1 (Bonjour/mDNS on macOS, not used on our supported platforms). The advisory recommends core::pin::pin! which is in std since Rust 1.68; async-dnssd has not released a fix. Re-review 2027-06-01 or when async-dnssd drops pin-utils."
